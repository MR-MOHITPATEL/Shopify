<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapiva-Style Purchase Flow Preview - ZenJeevani</title>
    <style>
        :root {
            --color-primary: #1b4332;
            --color-secondary: #2d6a4f;
            --color-accent: #ffc107;
            --color-light: #f1f8e9;
            --color-white: #ffffff;
            --radius-xl: 24px;
            --radius-lg: 20px;
            --radius-md: 12px;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            background: #fff;
            color: #333;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Hero */
        .hero { padding: 60px 0; }
        .hero-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; }
        .main-img { background: #f8f9fa; border-radius: var(--radius-xl); padding: 40px; }
        .main-img img { width: 100%; mix-blend-mode: multiply; }
        .hero-info h1 { font-size: 36px; color: var(--color-primary); margin: 0 0 10px; }
        .price { font-size: 28px; font-weight: 700; color: var(--color-secondary); margin-bottom: 20px; }
        
        /* Qty Selector */
        .qty-selector { display: flex; align-items: center; border: 1px solid #ddd; border-radius: var(--radius-md); width: fit-content; margin-bottom: 24px; overflow: hidden; }
        .qty-btn { background: none; border: none; width: 40px; height: 40px; font-size: 20px; cursor: pointer; color: var(--color-primary); }
        .qty-input { width: 50px; text-align: center; border: none; font-weight: 600; font-size: 16px; }

        .button-group { display: flex; flex-direction: column; gap: 12px; }
        .atc-btn { width: 100%; background: #fff; color: var(--color-primary); border: 2px solid var(--color-primary); padding: 18px; border-radius: var(--radius-md); font-weight: 700; cursor: pointer; }
        .buy-now { width: 100%; background: var(--color-primary); color: #fff; border: none; padding: 18px; border-radius: var(--radius-md); font-weight: 700; cursor: pointer; }

        /* Cart Drawer */
        .drawer-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; display:none; }
        .drawer { position: fixed; top:0; right:-400px; width:400px; height:100%; background:#fff; z-index:1001; transition: 0.3s; padding: 30px; box-sizing: border-box; display: flex; flex-direction: column; }
        .drawer.open { right: 0; }
        .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .drawer-close { font-size: 30px; cursor: pointer; }
        .cart-items { flex: 1; }
        .cart-item { display: flex; gap: 15px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        .item-img { width: 80px; height: 80px; background: #f8f9fa; border-radius: 10px; }
        .checkout-footer { padding-top: 20px; border-top: 1px solid #eee; }
        .checkout-btn { width: 100%; background: var(--color-primary); color: #fff; border: none; padding: 18px; border-radius: var(--radius-md); font-weight: 700; cursor: pointer; text-decoration: none; display: block; text-align: center; }

        /* Sticky Bar Mobile */
        .sticky-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; padding: 12px 20px; box-shadow: 0 -5px 20px rgba(0,0,0,0.1); display: none; align-items: center; justify-content: space-between; z-index: 999; box-sizing: border-box; }
        .buy-now-sticky { background: var(--color-primary); color: #fff; padding: 12px 24px; border-radius: 8px; font-weight: 700; border: none; }

        @media (max-width: 768px) {
            .hero-grid { grid-template-columns: 1fr; gap: 30px; }
            .sticky-bar { display: flex; }
            .drawer { width: 100%; right: -100%; }
        }
    </style>
</head>
<body>

    <section class="hero">
        <div class="container">
            <div class="hero-grid">
                <div class="main-img">
                    <img src="https://picsum.photos/id/102/1000/1000" alt="Product">
                </div>
                <div class="hero-info">
                    <h1>Ayurvedic Vitality Plus</h1>
                    <div class="price">₹1,299.00</div>
                    
                    <div class="qty-selector">
                        <button class="qty-btn" onclick="updatePreviewQty(-1)">−</button>
                        <input type="number" class="qty-input" value="1" id="preview-qty">
                        <button class="qty-btn" onclick="updatePreviewQty(1)">+</button>
                    </div>

                    <div class="button-group">
                        <button class="atc-btn" onclick="toggleDrawer(true)">ADD TO CART</button>
                        <button class="buy-now">BUY NOW</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div class="drawer-overlay" id="overlay" onclick="toggleDrawer(false)"></div>
    <div class="drawer" id="drawer">
        <div class="drawer-header">
            <h2>Your Cart</h2>
            <span class="drawer-close" onclick="toggleDrawer(false)">&times;</span>
        </div>
        <div class="cart-items">
            <div class="cart-item">
                <div class="item-img"></div>
                <div>
                    <strong>Ayurvedic Vitality Plus</strong><br>
                    <small>₹1,299.00</small><br><br>
                    <div class="qty-selector">
                        <button class="qty-btn">−</button>
                        <input type="number" class="qty-input" value="1">
                        <button class="qty-btn">+</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="checkout-footer">
            <div style="display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: 700;">
                <span>Total</span>
                <span>₹1,299.00</span>
            </div>
            <a href="#" class="checkout-btn">PROCEED TO CHECKOUT</a>
        </div>
    </div>

    <div class="sticky-bar">
        <div><strong>Ayurvedic Vitality</strong><br><small>₹1,299.00</small></div>
        <button class="buy-now-sticky">BUY NOW</button>
    </div>

    <script>
        function toggleDrawer(open) {
            document.getElementById('drawer').classList.toggle('open', open);
            document.getElementById('overlay').style.display = open ? 'block' : 'none';
        }
        function updatePreviewQty(amt) {
            const input = document.getElementById('preview-qty');
            input.value = Math.max(1, parseInt(input.value) + amt);
        }
    </script>

</body>
</html>
